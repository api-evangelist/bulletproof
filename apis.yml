apis:
- name: Bulletproof Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API served from the Bulletproof store
    host. Anonymous introspection succeeded on 2026-08-08 (424 types, QueryRoot +
    Mutation), and anonymous queries against shop, products, collections and cart
    return live data. Date-versioned (2024-10 through 2026-01 plus unstable all
    answered 200) with cost/complexity reported per request.'
  humanURL: https://shop.bulletproof.com/agents.md
  baseURL: https://shop.bulletproof.com/api/2026-01/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Storefront
  tags_raw:
  - GraphQL
  - Ecommerce
  - Storefront
  properties:
  - type: GraphQL
    url: graphql/bulletproof-storefront.graphql
  - type: Examples
    url: examples/bulletproof-storefront-graphql-response.json
  - type: DataModel
    url: data-model/bulletproof-data-model.yml
- name: Bulletproof UCP Agentic Commerce MCP
  description: 'A live Model Context Protocol endpoint implementing the Universal
    Commerce Protocol (UCP) for agent-driven commerce. An anonymous tools/list
    returned 13 tools with complete JSON Schema input contracts covering catalog
    search/lookup, product detail, cart, checkout and order. initialize reports
    serverInfo universal-commerce 0.1.0 on MCP protocol 2024-11-05. Tool calls
    require a resolvable UCP agent profile URI, and order/checkout tools additionally
    require a JWT.'
  humanURL: https://shop.bulletproof.com/agents.md
  baseURL: https://shop.bulletproof.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - UCP
  properties:
  - type: MCPServer
    url: mcp/bulletproof-mcp.yml
  - type: ToolCrosswalk
    url: mcp/bulletproof-tool-crosswalk.yml
  - type: Examples
    url: examples/bulletproof-ucp-mcp-initialize.json
- name: Bulletproof Storefront JSON Catalog
  description: 'The unauthenticated Shopify storefront JSON catalog endpoints
    (/products.json, /collections.json, /products/{handle}.json,
    /collections/{handle}/products.json) documented in the store''s own agents.md as
    the read-only browsing surface for agents that do not need to transact.'
  humanURL: https://shop.bulletproof.com/agents.md
  baseURL: https://shop.bulletproof.com
  tags:
  - E-Commerce
  - Catalog
  - JSON
  tags_raw:
  - Ecommerce
  - Catalog
  - JSON
  properties:
  - type: Examples
    url: examples/bulletproof-storefront-products-json.json
- name: Bulletproof WordPress Content REST API
  description: 'The WordPress REST API behind the Bulletproof editorial site
    (bulletproof.com), self-describing 16 namespaces and 384 routes at /wp-json/ with
    no authentication schemes advertised. Covers posts, pages, recipes, reviewers and
    taxonomies used across the coffee, supplement, diet and recipe article libraries.'
  humanURL: https://www.bulletproof.com/
  baseURL: https://www.bulletproof.com/wp-json/wp/v2
  tags:
  - Content
