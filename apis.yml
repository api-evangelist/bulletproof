aid: bulletproof
name: BulletProof
description: 'Bulletproof (Bulletproof 360, Inc.) is a Seattle-founded functional
  nutrition and health-and-wellness brand — toxin-tested coffee, C8 MCT oil, collagen,
  creamers and supplements — founded in 2013 by Dave Asprey and sold direct-to-consumer
  and through national retail. Bulletproof is not a software vendor and publishes no
  developer program, yet its commerce and content stacks expose a real, callable,
  unauthenticated machine surface: a Shopify Storefront GraphQL API that answers
  introspection anonymously at shop.bulletproof.com, a live UCP (Universal Commerce
  Protocol) MCP endpoint whose tools/list returns 13 agent tools with full JSON Schema
  input contracts, OAuth 2.0 / OpenID Connect discovery documents for customer
  accounts, agent-facing llms.txt and agents.md instructions on the storefront, and a
  384-route WordPress REST API behind the editorial site.'
