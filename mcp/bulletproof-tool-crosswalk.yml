  binding: semantic
  confidence: high
- tool: update_cart
  category: cart
  graphql: [cartLinesAdd, cartLinesUpdate, cartLinesRemove, cartAttributesUpdate, cartNoteUpdate, cartDiscountCodesUpdate, cartBuyerIdentityUpdate]
  binding: semantic
  confidence: medium
  note: one MCP tool fans out to seven GraphQL mutations; the tool takes a whole cart object.
- tool: cancel_cart
  category: cart
  graphql: []
  binding: none
  confidence: low
  note: >-
    No Storefront mutation cancels or deletes a cart. The closest field is
    cartRemovePersonalData, which is not equivalent.
- tool: create_checkout
  category: checkout
  graphql: [cartCreate, cartPrepareForCompletion]
  binding: semantic
  confidence: low
  note: >-
    The Storefront API retired the Checkout object; checkout now runs through the Cart
    completion mutations, so this is a capability match, not an object match.
- tool: get_checkout
  category: checkout
  graphql: [cart, cartCompletionAttempt]
  binding: semantic
  confidence: low
- tool: update_checkout
  category: checkout
  graphql: [cartDeliveryAddressesUpdate, cartSelectedDeliveryOptionsUpdate, cartPaymentUpdate, cartBillingAddressUpdate]
  binding: semantic
  confidence: medium
- tool: complete_checkout
  category: checkout
  graphql: [cartSubmitForCompletion]
  binding: semantic
  confidence: medium
  note: >-
    The MCP tool accepts meta["idempotency-key"]; the GraphQL mutation takes an
    attemptId that serves the same replay-safety role.
- tool: cancel_checkout
  category: checkout
  graphql: []
  binding: none
  confidence: low
- tool: get_order
  category: order
  graphql: [customer]
  binding: semantic
  confidence: low
  note: >-
    There is no QueryRoot.order field. Orders are reachable only as Customer.orders
    behind a customer access token, whereas the MCP tool takes an order id plus a JWT.
