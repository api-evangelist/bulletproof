source:
- mcp/bulletproof-ucp-mcp-tools.json
- graphql/bulletproof-storefront.graphql
note: >-
  Bulletproof publishes no OpenAPI, so this crosswalk binds each UCP MCP tool to the
  Storefront GraphQL field(s) that expose the same capability rather than to REST
  operationIds. Both surfaces were introspected live on 2026-08-08 — the 13 tools from
  an anonymous tools/list, the 424-type schema from an anonymous GraphQL introspection.
  The two surfaces are separate projections of the same store: the MCP tools are UCP
  primitives served by Shopify's universal-commerce server, the GraphQL fields are the
  Storefront API. Nothing here asserts that one is implemented on top of the other, so
  every binding is marked semantic and confidence is set accordingly.
surfaces:
  openapi:
    present: false
    note: no OpenAPI or Swagger published on any Bulletproof host (probed 2026-08-08)
  graphql:
    endpoint: https://shop.bulletproof.com/api/2026-01/graphql.json
    introspection: open
    sdl: graphql/bulletproof-storefront.graphql
    types: 424
  mcp:
    url: https://shop.bulletproof.com/api/ucp/mcp
    tools_list: open
    tools_call: gated (UCP agent profile URI required; JWT required for order/checkout)
    manifest: mcp/bulletproof-mcp.yml
crosswalk:
- tool: search_catalog
  category: catalog
  graphql: [products, search, predictiveSearch]
  binding: semantic
  confidence: high
  note: QueryRoot.search and QueryRoot.products both accept a query string with cursor pagination.
- tool: lookup_catalog
  category: catalog
  graphql: [nodes, product, productByHandle]
  binding: semantic
  confidence: medium
  note: QueryRoot.nodes resolves a list of gids; the MCP tool caps the batch at 10 identifiers.
- tool: get_product
  category: catalog
  graphql: [product, productByHandle]
  binding: semantic
  confidence: high
  note: >-
    Product.selectedOrFirstAvailableVariant / variantBySelectedOptions cover the tool's
    selected/preferences option-narrowing behaviour.
- tool: get_cart
  category: cart
  graphql: [cart]
  binding: semantic
  confidence: high
- tool: create_cart
  category: cart
